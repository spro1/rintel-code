name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
# Actions are pinned to commits, not tags: a tag can be moved to different code. Update the hash and the version comment together.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4; the Java adapter tests compile and run it
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; the TypeScript adapter runs on Node with the bundled compiler
        with:
          node-version: "22" # 20 reached end of life in April 2026
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck # dependency policy: no known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: third-party notices are up to date
        run: make notices && git diff --exit-code THIRD_PARTY_NOTICES

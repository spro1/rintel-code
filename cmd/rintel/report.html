<style>

<body>
<header>
  <strong>rintel</strong><span id="repo" class="muted"></span><span id="commit" class="mono muted"></span>
  <nav id="nav" role="tablist"></nav>
  <input id="find" type="search" style="margin-left:auto;width:240px">
  <button class="btn" id="theme"></button>

<main id="main"></main>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
let lang = D.lang === "ko" ? "ko" : "en";
let goOnly = false; // set once the symbols are loaded: Go has types and files, not classes
const L = (en, ko) => {
  const t = lang === "ko" ? ko : en;
  if (!goOnly || typeof t !== "string") return t;
  return t.replace(/클래스/g, "타입").replace(/\bsubclass(es)?\b/g, "subtype$1").replace(/\bSubclass(es)?\b/g, "Subtype$1").replace(/\bclass(es)?\b/g, (m, p) => "type" + (p ? "s" : "")).replace(/\bClass(es)?\b/g, (m, p) => "Type" + (p ? "s" : ""));

const fmt = n => Number(n).toLocaleString("en-US");

// ---------- DOM helpers. Repository-derived text only ever goes through textContent. ----------

function table(heads, rows, foot) {

    el("thead", {}, el("tr", {}, heads.map(h => el("th", { class: h.num ? "num" : null, style: h.w ? `width:${h.w}` : null }, h.t ?? h)))),
    el("tbody", {}, rows.map(r => el("tr", {}, r.map((c, i) => el("td", { class: heads[i] && heads[i].num ? "num" : null }, c))))),
    foot && el("tfoot", {}, el("tr", {}, foot.map((c, i) => el("td", { class: heads[i] && heads[i].num ? "num" : null }, c))))));
}
const mono = (...k) => el("span", { class: "mono" }, k);
const muted = (...k) => el("span", { class: "muted" }, k);

// ---------- model ----------
// same rule as the core: test directories, Go test files, JS/TS spec files, pytest files
const TEST_RE = /(^|\/)(src\/)?tests?\/|(^|\/)__tests__\/|(^|\/)e2e\/|_test\.go$|\.(test|spec)\.[cm]?[jt]sx?$|(^|\/)test_[^\/]*\.py$|_test\.py$|(^|\/)conftest\.py$/;

const off = x => x.test || x.gen || x.generated; // left out by default: test code and generated code
const S = D.syms.map(([id, type, parent, file, line, ext, synth, kind, role, ann], i) =>
  ({ i, id, type, parent, file, line, ext: !!ext, synth, kind, role, ann: !!ann, out: [], in: [], kids: [], unres: 0, testRefs: 0 }));
const byId = new Map(S.map(s => [s.id, s]));
for (const s of S) {
  if (s.parent >= 0) S[s.parent].kids.push(s);
  s.test = s.file >= 0 && TEST_RE.test(D.files[s.file]);
  s.gen = s.file >= 0 && !s.test && GEN_RE.test(D.files[s.file]); // written by a tool: analyzed, but out of metrics and graphs unless asked for

  let c = null;
  for (let x = s; x; x = x.parent >= 0 ? S[x.parent] : null) if (x.type === "class") c = x;

const E = D.edges.map(([s, d, rel, ev, rule, file, line]) => ({ s, d, rel, ev, rule: rule >= 0 ? D.rules[rule] : "", file, line }));

const classes = S.filter(s => !s.ext && s.type === "class" && s.cls === s);
const byFile = id => id.startsWith("ts:") || id.startsWith("py:"); // languages whose IDs name the file: the package is its directory
const pkgOf = c => {
  let q = c.id.slice(c.id.indexOf(":") + 1);
  const i = q.lastIndexOf(".");

  q = q.slice(0, i);
  if (!byFile(c.id)) return q;
  const j = q.lastIndexOf("/");
  return j < 0 ? "." : q.slice(0, j);
};
for (const c of classes) {
  c.pkg = pkgOf(c);
  if (!c.role && c.kind === "interface" && c.out.some(e => e.rel === "extends" && /Repository$/.test(S[e.d].id))) c.role = "repository";
}
const pkgNames = [...new Set(classes.map(c => c.pkg))].sort();

const hasRoles = classes.some(c => c.role);
const byFilePkgs = classes.some(c => byFile(c.id)); // directory packages are shown whole: "src/api", not "api"
const base = (() => { // longest common prefix ending at a package boundary ("." in Java, "/" in Go), dropped from labels

  let p = pkgNames[0];
  for (const n of pkgNames) { let i = 0; while (i < p.length && i < n.length && p[i] === n[i]) i++; p = p.slice(0, i); }
  if (pkgNames.includes(p)) return p; // one package is the parent of all the others
  return p.slice(0, Math.max(p.lastIndexOf("."), p.lastIndexOf("/")) + 1).replace(/[./]$/, "");

const plabel = p => { if (!p) return "(default)"; if (p === ".") return L("(root)", "(루트)"); if (p === base || !base) return byFilePkgs ? p : p.split(/[./]/).pop(); return p.slice(base.length + 1); };

function short(id) { // same shortening as the CLI
  if (byFile(id)) return id.slice(id.lastIndexOf("/") + 1).replace(/^(ts|py):/, "").replace("#", "."); // client.UserService.getUser, models.py
  if (id.startsWith("go:")) { // Go: package name + declaration (web.Server.handle); file containers read as web/server.go
    let q = id.slice(3);
    const i = q.lastIndexOf("/");

const member = s => { // the name inside its class or file
  if (!s.id.startsWith("java:")) return s.id.slice(Math.max(s.id.lastIndexOf("#"), s.id.lastIndexOf(".")) + 1);
  const t = short(s.id), c = s.cls ? short(s.cls.id) : "";

// inside its package's group the qualifier would only repeat the heading
const inPkg = c => c.id.startsWith("java:") ? short(c.id) : c.kind === "file" ? short(c.id).split("/").pop() : short(c.id).split(".").pop();
const loc = (file, line) => file >= 0 ? `${D.files[file]}:${line}` : L("(library)", "(라이브러리)");
const fname = f => f >= 0 ? D.files[f].replace(/^.*?(src\/(main|test)\/[a-z]+\/)/, "").replace(base.replace(/\./g, "/") + "/", "") : "";
const lib = id => { // library group of an external symbol
  if (byFile(id)) { // ts:pkg/@types/node.readFile, ts:lib/std.Array#map, py:lib/fastapi.FastAPI, py:std/os.path.join
    const pth = id.slice(3).split("#")[0];
    if (/^(lib\/std|std\/|lib\/unknown)/.test(pth)) return "std";
    const rest = pth.replace(/^(pkg|lib)\//, "");
    return id.startsWith("py:") ? rest.split(".")[0] : rest.slice(0, rest.lastIndexOf(".") < 0 ? undefined : rest.lastIndexOf("."));
  }
  if (id.startsWith("go:")) { // module-ish prefix of the import path; the standard library has no dot in its first element
    const pth = id.slice(3).split("#")[0], pk = pth.slice(0, pth.lastIndexOf(".")).split("/");
    return pk[0].includes(".") ? pk.slice(0, 3).join("/") : "std";

  let n = 0; while (n < q.length && /^[a-z_]/.test(q[n])) n++;
  const pk = q.slice(0, n);

const M = D.metrics, mClass = new Map(M.classes.map(c => [c.id, c])), mMethod = new Map(M.methods.map(m => [m.id, m]));
const srcCache = new Map();
const srcLines = f => { if (!D.sources || D.sources[f] == null) return null; if (!srcCache.has(f)) srcCache.set(f, D.sources[f].split("\n")); return srcCache.get(f); };

// ---------- dependency analysis (recomputed when the "include tests" switch flips) ----------
let withTests = false;
const cache = {};
function deps() {

    if (e.rel === "overrides") continue;
    const a = S[e.s].cls, b = S[e.d].cls;

    const k = a.i + ">" + b.i;
    let x = cd.get(k);
    if (!x) cd.set(k, x = { a, b, w: 0, kinds: {} });
    x.w++; x.kinds[e.rel] = (x.kinds[e.rel] || 0) + 1;
  }
  const P = new Map(pkgNames.map(n => [n, { name: n, classes: [], ca: new Set(), ce: new Set() }]));
  for (const c of cls) P.get(c.pkg).classes.push(c);
  for (const [n, p] of [...P]) if (!p.classes.length) P.delete(n);

  const pd = new Map();
  for (const x of cd.values()) {

  const seen = new Set([h]), found = new Set();
  let frontier = [h];
  for (let depth = 0; depth < 5 && frontier.length; depth++) {
    const next = [];
    for (const s of frontier) for (const e of s.out) {
      const t = S[e.d];
      if (e.rel !== "calls" || t.ext || seen.has(t)) continue;
      seen.add(t); next.push(t);
      if (t.cls && t.cls.role === "repository") found.add(t.cls);
    }
    frontier = next;
  }
  return [...found];
}

    [...groups.values()].sort((a, b) => b.es.length - a.es.length).map(g => [
      el("h2", {}, g.c ? symBtn(g.c) : "?", el("span", { class: "tag" }, L(`${g.es.length} endpoint${g.es.length > 1 ? "s" : ""}`, `엔드포인트 ${g.es.length}개`)), g.c && el("span", { class: "tag mono" }, fname(g.c.file))),

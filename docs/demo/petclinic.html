const go = h => { if (location.hash.slice(1) === h) render(); else location.hash = h; };
function render() {
  const h = decodeURIComponent(location.hash.slice(1)) || "overview";
  const at = h.startsWith("code/") ? h.lastIndexOf("@") : -1;
  if (at > 0) sel.tab = h.slice(at + 1);
  const cur = h.startsWith("code/") ? byId.get(at > 0 ? h.slice(5, at) : h.slice(5)) : null;
  const tab = h.startsWith("code") ? "code" : tabsDef().some(t => t[0] === h) ? h : "overview";
  const o = D.overview, main = document.getElementById("main");
  document.documentElement.lang = lang;
  document.title = `${D.repo} · rintel`;
  document.getElementById("repo").textContent = D.repo;
  document.getElementById("commit").textContent = o.scan.commit ? o.scan.commit.slice(0, 7) : "";
  document.getElementById("lang").textContent = lang === "ko" ? "English" : "한국어";
  if (typeof applyTheme === "function") applyTheme();
  const find = document.getElementById("find");
  find.placeholder = L("Find symbol", "심볼 찾기"); find.setAttribute("aria-label", find.placeholder);
  document.getElementById("nav").replaceChildren(...tabsDef().map(([k, t]) => el("button", { role: "tab", "aria-selected": String(k === tab), onclick: () => go(k) }, t)));
  const view = { overview, metrics: metricsView, deps: depsView, api: apiView, checks: checksView, unresolved: unresolvedView }[tab];
  main.style.overflow = tab === "code" ? "hidden" : "auto";
  const keep = [...main.querySelectorAll(".ide > *")].map(n => n.scrollTop);
  main.replaceChildren(tab === "code" ? codeView(cur) : view());
  if (tab !== shownTab) main.scrollTop = 0; // another tab starts at its top; a re-render of the same tab stays put
  shownTab = tab;
  if (tab === "code") [...main.querySelectorAll(".ide > *")].forEach((n, i) => { if (i < 2 && keep[i]) n.scrollTop = keep[i]; });
  const total = o.resolved_calls + o.unresolved_calls;
  document.getElementById("foot").replaceChildren(
    el("span", {}, `${L("scan", "스캔")} #${o.scan.id} · ${D.generated}`),
    el("span", {}, L(`calls ${fmt(o.resolved_calls)} / ${fmt(total)} resolved (${pct(o.resolved_calls, total)})`, `호출 ${fmt(o.resolved_calls)} / ${fmt(total)} 해석 (${pct(o.resolved_calls, total)})`)),
    el("span", {}, `${L("inferred", "추정")} ${fmt(o.edges.heuristic || 0)}`),
    el("span", {}, `${L("unresolved", "미해석")} ${D.unresolved.length}`),
    ...(o.classpath_jars > 0 ? [el("span", { style: "margin-left:auto" }, `JAR ${o.classpath_jars}`)] : []));
}
document.getElementById("find").addEventListener("input", e => { query = e.target.value; if (location.hash.slice(1).startsWith("code")) render(); else go("code"); });
document.getElementById("lang").addEventListener("click", () => { lang = lang === "ko" ? "en" : "ko"; render(); });
// theme: follow the system unless the reader chooses; ?theme=light|dark in the address also works
const themes = ["auto", "light", "dark"];
let theme = new URLSearchParams(location.search).get("theme") || (() => { try { return localStorage.getItem("rintel-theme"); } catch { return null; } })() || "auto";
const applyTheme = () => { if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme").textContent = { auto: L("Theme: auto", "테마: 자동"), light: L("Theme: light", "테마: 밝게"), dark: L("Theme: dark", "테마: 어둡게") }[theme] || theme; };
document.getElementById("theme").addEventListener("click", () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; try { localStorage.setItem("rintel-theme", theme); } catch {} applyTheme(); });
window.addEventListener("hashchange", () => { render(); });
render();
</script>
</body>
</html>
